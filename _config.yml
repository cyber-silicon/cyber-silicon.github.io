title: Cyber Silicon
description: مدونة عربية متخصصة في البرمجة والأمن السيبراني وLinux، تقدم شروحات عملية وأدوات وتجارب تطبيقية خطوة بخطوة.
url: "https://cyber-silicon.github.io"
baseurl: ""
include:
  - .well-known
lang: ar
timezone: Africa/Khartoum
direction: rtl
logo: /assets/images/avatar.png
author:
  name: Cyber Silicon
  url: https://cyber-silicon.github.io
  avatar: /assets/images/avatar.png
nav:
  - title: الرئيسية
    url: /
  - title: الأقسام
    url: /categories/
  - title: الوسوم
    url: /tags/
  - title: حول
    url: /about/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
paginate: 9
paginate_path: "/page:num/"
collections:
  pages:
    output: true
    permalink: /:name/
comments:
  enabled: true
  provider: giscus
  repo: "cyber-silicon/cyber-silicon.github.io"
  repo_id: "R_kgDOVXRHBA"
  category: "General"
  category_id: "DIC_kwDOVXRHBM4DJtF0"
  mapping: "pathname"
  strict: "1"
  reactions_enabled: "1"
  input_position: "bottom"
  lang: "ar"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - scripts
  - .github

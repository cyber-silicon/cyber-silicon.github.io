title: Cyber Silicon
description: منصة عربية للتقنية والأمن السيبراني والإلكترونيات والبرمجة.
url: "https://cyber-silicon.github.io"
baseurl: ""
lang: ar
timezone: Africa/Khartoum
direction: rtl
author:
  name: Cyber Silicon
  url: https://cyber-silicon.github.io
  avatar: /assets/images/avatar.png
nav:
  - title: الرئيسية
    url: /
  - title: الأقسام
    url: /categories/
  - title: الوسوم
    url: /tags/
  - title: حول
    url: /about/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
paginate: 9
paginate_path: "/page:num/"
collections:
  pages:
    output: true
    permalink: /:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

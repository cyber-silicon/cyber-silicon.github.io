<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ar' }}" dir="{{ site.direction | default: 'rtl' }}" data-theme="{{ site.theme_mode | default: 'light' }}">
{% include head.html %}
<body class="plus-ui-pro">
  <!-- Loading Progress Bar Like Plus UI -->
  <div id="progress-bar"></div>

  {% include header.html %}

  <main class="main-wrapper">
    <div class="container">
      <div class="main-content">
        {{ content }}
      </div>
      {% if page.layout == 'post' or page.layout == 'page' %}
        {% include sidebar.html %}
      {% endif %}
    </div>
  </main>

  {% include footer.html %}
  {% include color-switcher.html %}
  {% include search-modal.html %}
  {% if site.enable_pwa %}
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}');
    }
  </script>
  <script>
// إصلاح تكرار BASH نهائي - يحذف الثاني تلقائياً كل نصف ثانية
setInterval(function(){
  document.querySelectorAll('.post-content .highlight').forEach(function(b){
    var h=b.querySelectorAll('.code-header, .p-code-head, .highlight-header');
    for(var i=1;i<h.length;i++){h[i].remove();}
    var nested=b.querySelectorAll('.highlight');
    for(var j=0;j<nested.length;j++){
      if(nested[j]!==b){nested[j].outerHTML=nested[j].innerHTML;}
    }
  });
}, 500);
</script>
  {% endif %}
</body>
</html>

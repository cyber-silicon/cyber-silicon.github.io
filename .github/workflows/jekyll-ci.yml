name: Jekyll CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign-v2]

permissions:
  contents: read

concurrency:
  group: jekyll-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Verify protected TikTok file exists
        run: test -f tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt

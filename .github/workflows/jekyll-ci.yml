name: Jekyll CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign-v2]

permissions:
  contents: read

concurrency:
  group: jekyll-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Test Blogger sync importer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check frontend JavaScript syntax
        run: node --check assets/js/main.js

      - name: Check internal links and assets
        run: python3 scripts/check_internal_links.py

      - name: Validate generated site structure and SEO
        run: python3 scripts/validate_generated_site.py

      - name: Verify TikTok Web OAuth callback and Android App Links assets
        run: |
          set -euo pipefail
          test -s _site/tiktok-callback/index.html
          test -s _site/.well-known/assetlinks.json
          python3 -m json.tool _site/.well-known/assetlinks.json >/dev/null
          grep -Fq 'https://cyber-silicon.github.io/tiktok-callback/' _site/tiktok-callback/index.html
          grep -Fq 'com.cybersilicon.pro' _site/.well-known/assetlinks.json

      - name: Verify protected TikTok file is published unchanged
        run: |
          test -f tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt
          test -f _site/tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt
          cmp --silent \
            tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt \
            _site/tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt

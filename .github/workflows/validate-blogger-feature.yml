name: Validate Blogger development branch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-blogger-feature.yml"

permissions:
  contents: read

concurrency:
  group: validate-blogger-feature
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/blogger-parity-20261112

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Test Blogger importer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check internal links and assets
        run: python3 scripts/check_internal_links.py

      - name: Validate generated site and SEO
        run: python3 scripts/validate_generated_site.py

      - name: Verify protected OAuth and Android App Links assets
        run: |
          set -euo pipefail
          test -s _site/tiktok-callback/index.html
          test -s _site/.well-known/assetlinks.json
          python3 -m json.tool _site/.well-known/assetlinks.json >/dev/null
          grep -Fq 'https://cyber-silicon.github.io/tiktok-callback/' _site/tiktok-callback/index.html
          grep -Fq 'com.cybersilicon.pro' _site/.well-known/assetlinks.json
          test -f tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt
          cmp --silent tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt _site/tiktoky3OKmXmwUNjswR7HZjSinb9EBScow5tj.txt

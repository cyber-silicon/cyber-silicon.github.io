name: Import Blogger posts to development branch

on:
  workflow_dispatch:
  # Poll Blogger twice per hour; scheduled runs originate from the default branch.
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: blogger-import-feature-branch
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_URL: ${{ vars.BLOGGER_URL || 'https://cyber-silicon.blogspot.com/' }}
      BLOGGER_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_OAUTH_CLIENT_ID }}
      BLOGGER_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_OAUTH_CLIENT_SECRET }}
      BLOGGER_OAUTH_REFRESH_TOKEN: ${{ secrets.BLOGGER_OAUTH_REFRESH_TOKEN }}
      TARGET_BRANCH: feature/blogger-lifecycle-sync-20261115
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/blogger-lifecycle-sync-20261115
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Blogger sync credentials
        run: |
          for name in BLOGGER_API_KEY BLOGGER_OAUTH_CLIENT_ID BLOGGER_OAUTH_CLIENT_SECRET BLOGGER_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done

      - name: Sync Blogger additions, updates, and deletions
        run: python3 scripts/sync_blogger_posts.py --apply --sync-deletions

      - name: Commit imported posts to development branch
        run: |
          git add _posts/
          if git diff --cached --quiet; then
            echo "No Blogger post changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Blogger posts into development branch"
          test "$TARGET_BRANCH" = "feature/blogger-lifecycle-sync-20261115"
          git push origin "HEAD:refs/heads/feature/blogger-lifecycle-sync-20261115"

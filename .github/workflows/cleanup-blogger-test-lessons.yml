name: Remove Blogger test lessons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-blogger-test-lessons.yml"

permissions:
  contents: read

concurrency:
  group: blogger-test-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || '2033316582671880720' }}
      BLOGGER_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_OAUTH_CLIENT_ID }}
      BLOGGER_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_OAUTH_CLIENT_SECRET }}
      BLOGGER_OAUTH_REFRESH_TOKEN: ${{ secrets.BLOGGER_OAUTH_REFRESH_TOKEN }}
    steps:
      - name: Checkout development branch for test-content cleanup
        uses: actions/checkout@v4
        with:
          ref: feature/blogger-lifecycle-sync-20261115
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Blogger credentials
        run: |
          for name in BLOGGER_API_KEY BLOGGER_OAUTH_CLIENT_ID BLOGGER_OAUTH_CLIENT_SECRET BLOGGER_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done

      - name: Move the eight identified test lessons to Blogger Trash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API = "https://www.googleapis.com/blogger/v3"
          BLOG_ID = os.environ["BLOGGER_BLOG_ID"].strip()
          API_KEY = os.environ["BLOGGER_API_KEY"].strip()
          IDS = [
              "1235759867469387700",
              "3004261941942939031",
              "4909267688577719902",
              "5203618247247798952",
              "2663484855408253992",
              "735181877965248024",
              "1061904667240081919",
              "7784698631538252303",
          ]

          token_body = urlencode({
              "client_id": os.environ["BLOGGER_OAUTH_CLIENT_ID"].strip(),
              "client_secret": os.environ["BLOGGER_OAUTH_CLIENT_SECRET"].strip(),
              "refresh_token": os.environ["BLOGGER_OAUTH_REFRESH_TOKEN"].strip(),
              "grant_type": "refresh_token",
          }).encode()
          token_request = Request(
              "https://oauth2.googleapis.com/token",
              data=token_body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          try:
              with urlopen(token_request, timeout=25) as response:
                  token_data = json.loads(response.read().decode("utf-8"))
          except (HTTPError, URLError, TimeoutError, ValueError) as exc:
              raise SystemExit(f"OAuth token refresh failed safely: {type(exc).__name__}") from None
          access_token = token_data.get("access_token")
          if not access_token:
              raise SystemExit("OAuth did not return an access token.")

          def get_post(post_id):
              query = urlencode({"key": API_KEY, "view": "ADMIN"})
              request = Request(
                  f"{API}/blogs/{BLOG_ID}/posts/{post_id}?{query}",
                  headers={"Authorization": f"Bearer {access_token}", "Accept": "application/json"},
              )
              try:
                  with urlopen(request, timeout=25) as response:
                      return json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  if exc.code in (404, 410):
                      return None
                  raise SystemExit(f"Could not verify Blogger post {post_id}; HTTP {exc.code}.") from None
              except (URLError, TimeoutError, ValueError) as exc:
                  raise SystemExit(f"Could not verify Blogger post {post_id}: {type(exc).__name__}.") from None

          for post_id in IDS:
              post = get_post(post_id)
              if post is None:
                  print(f"{post_id}: already absent")
                  continue
              status = str(post.get("status", "")).casefold()
              if status == "soft_trashed":
                  print(f"{post_id}: already in Blogger Trash")
                  continue
              if status != "live":
                  raise SystemExit(
                      f"Refusing to permanently delete {post_id}: expected live post, found {status or 'unknown'}."
                  )

              query = urlencode({"key": API_KEY, "useTrash": "true"})
              request = Request(
                  f"{API}/blogs/{BLOG_ID}/posts/{post_id}?{query}",
                  headers={"Authorization": f"Bearer {access_token}", "Accept": "application/json"},
                  method="DELETE",
              )
              try:
                  with urlopen(request, timeout=25) as response:
                      if response.status not in (200, 204):
                          raise SystemExit(f"Blogger did not confirm moving {post_id} to Trash.")
              except HTTPError as exc:
                  raise SystemExit(f"Could not move test post {post_id} to Trash; HTTP {exc.code}.") from None
              except (URLError, TimeoutError) as exc:
                  raise SystemExit(f"Could not move test post {post_id} to Trash: {type(exc).__name__}.") from None

              verified = get_post(post_id)
              if verified is not None and str(verified.get("status", "")).casefold() != "soft_trashed":
                  raise SystemExit(f"Post {post_id} did not reach Blogger Trash; stopping cleanup.")
              print(f"{post_id}: moved to Blogger Trash and verified")
          PY

      - name: Remove all importer-owned test copies from development branch
        run: |
          python3 scripts/sync_blogger_posts.py --apply --sync-deletions
          if find _posts -maxdepth 1 -type f -name '*-blogger-*' -print -quit | grep -q .; then
            echo "::error::Blogger test-import files remain in the development branch."
            exit 1
          fi

      - name: Validate clean development site
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll and run importer tests
        run: |
          bundle exec jekyll build --trace
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check_internal_links.py
          python3 scripts/validate_generated_site.py

      - name: Commit clean development branch
        run: |
          git add _posts/
          if git diff --cached --quiet; then
            echo "No imported Blogger test files needed removal."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Blogger test lessons from development branch"
          git push origin "HEAD:refs/heads/feature/blogger-lifecycle-sync-20261115"

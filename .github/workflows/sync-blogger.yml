name: Sync Blogger posts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only, or import posts into the development branch"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

# Default to read-only. The apply job grants write access only to itself.
permissions:
  contents: read

concurrency:
  group: blogger-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
  BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
  BLOGGER_URL: ${{ vars.BLOGGER_URL || 'https://cyber-silicon.blogspot.com/' }}

jobs:
  preview:
    if: inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Blogger API key
        shell: bash
        run: |
          if [[ -z "$BLOGGER_API_KEY" ]]; then
            echo "::error::Add BLOGGER_API_KEY as a repository secret before running this workflow."
            exit 1
          fi

      - name: Preview published Blogger posts
        run: python3 scripts/sync_blogger_posts.py

  apply:
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Restrict sync to the development branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/feature/blogger-parity-20261112" ]]; then
            echo "::error::Apply is restricted to feature/blogger-parity-20261112. Choose Preview to inspect another branch."
            exit 1
          fi

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/blogger-parity-20261112

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Blogger API key
        shell: bash
        run: |
          if [[ -z "$BLOGGER_API_KEY" ]]; then
            echo "::error::Add BLOGGER_API_KEY as a repository secret before running this workflow."
            exit 1
          fi

      - name: Apply Blogger import
        run: python3 scripts/sync_blogger_posts.py --apply

      - name: Commit imported posts
        shell: bash
        run: |
          git add _posts/
          if git diff --cached --quiet; then
            echo "No new or updated Blogger posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync published Blogger posts"
          git push origin "HEAD:refs/heads/feature/blogger-parity-20261112"

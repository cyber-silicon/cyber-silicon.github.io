<div class="search-backdrop" data-search-backdrop hidden></div>
<section class="search-dialog" data-search-dialog hidden role="dialog" aria-modal="true" aria-labelledby="search-title">
  <div class="search-head"><h2 id="search-title">ابحث في المدونة</h2><button class="icon-button" data-search-close aria-label="إغلاق">×</button></div>
  <input id="searchInput" type="search" placeholder="اكتب عنواناً أو كلمة..." autocomplete="off">
  <div id="searchResults" class="search-results">
    {% for post in site.posts %}<a class="search-item" data-search-text="{{ post.title | downcase }} {{ post.tags | join: ' ' | downcase }}" href="{{ post.url | relative_url }}"><strong>{{ post.title }}</strong><small>{{ post.date | date: "%Y-%m-%d" }}</small></a>{% endfor %}
  </div>
</section>

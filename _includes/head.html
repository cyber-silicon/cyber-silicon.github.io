<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
{% seo %}
<meta name="theme-color" content="#071018">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="index,follow,max-image-preview:large">
<script>
try{
  const t=localStorage.getItem('cs-theme');
  if(t)document.documentElement.dataset.theme=t;
  else document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/cyber-silicon.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/avatar.png' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>

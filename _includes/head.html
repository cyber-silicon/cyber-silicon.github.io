<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- SEO -->
{% seo %}
<meta name="theme-color" content="{{ site.primary_color | default: '#2962ff' }}">
<meta name="color-scheme" content="light dark">

<!-- Fonts - Tajawal for Arabic like Plus UI Arabic -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Plus UI Pro CSS -->
<link rel="stylesheet" href="{{ '/assets/css/plus-ui-pro.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/fix-code.css' | relative_url }}">
<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- RSS -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<!-- Preload -->
<link rel="preload" href="{{ '/assets/js/plus-ui.js' | relative_url }}" as="script">

<style>
  :root {
    --primary: {{ site.primary_color | default: '#2962ff' }};
    --primary-dark: {{ site.primary_color | default: '#2962ff' }}dd;
  }
</style>

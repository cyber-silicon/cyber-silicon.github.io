<header class="site-header">
  <div class="shell header-row">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Cyber Silicon">
      <span class="brand-mark" aria-hidden="true">CS</span>
      <span><strong>Cyber Silicon</strong><small>تقنية • أمن • برمجة</small></span>
    </a>
    <nav class="desktop-nav" aria-label="التنقل الرئيسي">
      {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>{% endfor %}
      <a href="{{ '/bookmarks/' | relative_url }}"{% if page.url == '/bookmarks/' %} class="active"{% endif %}>المحفوظات</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" data-search-open aria-label="بحث">⌕</button>
      <button class="icon-button" data-theme-toggle aria-label="تبديل المظهر">◐</button>
      <button class="icon-button mobile-trigger" data-menu-toggle aria-label="فتح القائمة" aria-expanded="false" aria-controls="mobileNav">☰</button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav" data-mobile-nav aria-label="قائمة الهاتف">
    {% for item in site.nav %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
    <a href="{{ '/bookmarks/' | relative_url }}">المحفوظات</a>
  </nav>
</header>

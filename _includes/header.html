<header class="site-header plus-header">
  <div class="container header-inner">
    <!-- Logo Like Plus UI -->
    <a href="{{ '/' | relative_url }}" class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">
        <strong>{{ site.title | split: '|' | first | default: 'Cyber Silicon' }}</strong>
        <small>Plus UI Pro</small>
      </span>
    </a>

    <!-- Navigation Like Plus UI -->
    <nav class="main-nav" id="mainNav">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
        <span class="nav-icon">{{ item.icon }}</span>
        {{ item.title }}
      </a>
      {% endfor %}
    </nav>

    <!-- Header Actions Like Plus UI -->
    <div class="header-actions">
      <button class="icon-btn search-btn" onclick="openSearch()" title="بحث">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      
      <button class="icon-btn color-btn" onclick="openColorSwitcher()" title="تغيير اللون">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/></svg>
      </button>

      <button class="icon-btn theme-btn" onclick="toggleTheme()" title="الوضع الليلي">
        <span class="theme-icon light">🌙</span>
        <span class="theme-icon dark">☀️</span>
      </button>

      <button class="icon-btn menu-btn mobile-only" onclick="toggleMobileMenu()" title="القائمة">☰</button>
    </div>
  </div>

  <!-- Mobile Menu Like Plus UI -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
      <span>القائمة</span>
      <button onclick="toggleMobileMenu()">✕</button>
    </div>
    {% for item in site.nav %}
    <a href="{{ item.url | relative_url }}" class="mobile-nav-link">{{ item.icon }} {{ item.title }}</a>
    {% endfor %}
  </div>
</header>
